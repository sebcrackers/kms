<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFC531">
<title>Bulbula Mulu Wengel No 1 Kids Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@500;700;800&display=swap" rel="stylesheet">
<script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#FBF1DD; --paper:#FFFDF6; --ink:#3A2A21; --ink2:#8A776A;
  --yellow:#FFC531; --red:#FF6B6B; --orange:#FF9838; --teal:#2EC4B6;
  --berry:#F2668B; --grape:#9B6BD1; --green:#58B968; --danger:#E4553F;
  --line:2.5px solid var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-size:18px;line-height:1.45;
  font-family:'Baloo 2','Noto Sans Ethiopic',system-ui,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(58,42,33,.06) 1.6px,transparent 1.7px);
  background-size:26px 26px;
}
body.am{font-family:'Noto Sans Ethiopic','Baloo 2',system-ui,sans-serif;line-height:1.6}
button{font-family:inherit;color:var(--ink)}
svg{vertical-align:middle}
#app{max-width:560px;margin:0 auto;padding:0 16px 40px;min-height:100svh}
.screen{animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- error bar ---------- */
#errbar{position:fixed;top:0;left:0;right:0;z-index:400;display:none;align-items:center;gap:10px;
 background:#FAD9D3;border-bottom:2.5px solid var(--ink);padding:10px 14px;font-weight:700;font-size:15px}
#errbar span{flex:1;min-width:0;word-break:break-word}
#errbar button{flex:none;width:36px;height:36px;border:2px solid var(--ink);border-radius:10px;
 background:#fff;font-weight:800;cursor:pointer}

/* ---------- sun mascot ---------- */
.sun{width:150px;height:150px;display:block;margin:0 auto;animation:bob 4.5s ease-in-out infinite}
.mini{flex:none}
.mini .sun{width:58px;height:58px;margin:0;animation-duration:6s}
.rays{transform-origin:100px 100px;animation:spin 46s linear infinite}
.eyes{transform-origin:100px 94px;animation:blink 4.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;
 font-size:19px;background:var(--paper);border:var(--line);border-radius:16px;padding:14px 20px;
 box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;
 transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn svg{width:22px;height:22px}
.btn.full{width:100%}
.btn.sm{font-size:16px;padding:9px 14px;border-width:2px;box-shadow:0 3px 0 var(--ink);border-radius:12px}
.btn.sm svg{width:18px;height:18px}
.btn-yellow{background:var(--yellow)}
.btn-green{background:var(--green)}
.btn-red{background:var(--danger);color:#FFF6E3}
.iconbtn{width:48px;height:48px;flex:none;display:grid;place-items:center;background:var(--paper);
 border:var(--line);border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;touch-action:manipulation;
 transition:transform .07s,box-shadow .07s}
a.iconbtn{text-decoration:none;color:var(--ink)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.iconbtn svg{width:22px;height:22px}
.quiet{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:none;
 border:2px dashed rgba(58,42,33,.4);border-radius:14px;padding:11px;font-weight:800;font-size:16.5px;
 cursor:pointer;touch-action:manipulation}
.quiet svg{width:19px;height:19px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.top-t{font-size:24px;font-weight:800;flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tcount{font-size:15px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff;white-space:nowrap}

/* ---------- inputs ---------- */
.input{width:100%;font-family:inherit;font-size:18px;font-weight:600;color:var(--ink);background:#fff;
 border:var(--line);border-radius:14px;padding:14px 16px}
.input:focus{outline:3px solid var(--yellow);outline-offset:1px}
.input::placeholder{color:#B7A794;font-weight:500}
.lab{display:block;font-weight:800;font-size:16px;margin:16px 0 6px}
.pw-wrap{position:relative;margin-bottom:14px}
.pw-wrap .input{padding-left:46px;padding-right:52px}
.lock{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--ink2)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;
 background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.eye svg{width:22px;height:22px}

/* ---------- login / language ---------- */
.login{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:30px 0}
.login h1{font-size:29px;font-weight:800;text-align:center;margin:20px 0 10px;line-height:1.2}
.tagline{text-align:center;font-size:19px;font-weight:800;margin-bottom:10px}
.amh{text-align:center;font-size:17px;font-weight:600;color:var(--ink2);margin-bottom:26px}
.hl{background:var(--yellow);padding:1px 9px;border-radius:9px;
 box-decoration-break:clone;-webkit-box-decoration-break:clone}
.login-err{display:none;color:var(--danger);font-weight:700;text-align:center;margin:2px 0 12px;font-size:17px}
.login-err.show{display:block}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.login-foot{text-align:center;color:var(--ink2);font-size:14px;font-weight:600;margin-top:26px}
.langname{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;
 padding:14px 22px;font-size:25px;font-weight:800;line-height:1.2}
.langbtn{gap:0}

/* ---------- dashboard ---------- */
.dash-top{display:flex;align-items:center;gap:12px;padding:20px 0 6px}
.hello{font-size:25px;font-weight:800;line-height:1.1}
.dash-date{font-size:15.5px;font-weight:600;color:var(--ink2)}
.dash-top .syncpill{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;border:2px solid var(--ink);
 border-radius:999px;padding:5px 11px;background:#fff;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.ok{background:#D9F2DC}.pill.wait{background:var(--yellow)}.pill.err{background:#FAD9D3}.pill.off{background:#EFE6D6}
.bday{width:100%;display:flex;align-items:center;gap:14px;background:var(--yellow);border:var(--line);
 border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;
 font-size:19px;font-weight:800;margin:14px 0 6px;touch-action:manipulation;
 transition:transform .07s,box-shadow .07s}
.bday:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.bday svg{width:26px;height:26px;flex:none}
.bday .btx{flex:1}
.bday small{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.soon{background:var(--paper);border:var(--line);border-radius:18px;box-shadow:0 4px 0 var(--ink);margin:14px 0 6px;overflow:hidden}
.soon-h{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;padding:12px 16px;
 border-bottom:2px dashed rgba(58,42,33,.25);background:#FFEFBF}
.soon-h svg{width:19px;height:19px}
.soon-row{display:flex;align-items:center;gap:12px;padding:11px 16px;font-size:17px}
.soon-row+.soon-row{border-top:2px dashed rgba(58,42,33,.18)}
.soon-d{flex:none;width:74px;font-weight:800;font-size:14px;color:var(--ink2)}
.soon-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon-m{flex:none;font-weight:700;font-size:14.5px;color:var(--ink2)}
.soon-extra{font-size:15px;color:var(--ink2);font-weight:700}
.acts{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.act{width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px;
 border:var(--line);border-radius:22px;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation;
 transition:transform .07s,box-shadow .07s}
.act:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.act .ico{width:58px;height:58px;flex:none;display:grid;place-items:center;background:#fff;
 border:2.5px solid var(--ink);border-radius:16px}
.act .ico svg{width:28px;height:28px}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-size:22px;font-weight:800;line-height:1.15}
.act .tx small{font-size:15.5px;font-weight:600;color:var(--ink2)}
.act svg.chev{width:26px;height:26px;flex:none;color:var(--ink2)}
.act.att{background:var(--yellow)}
.act.kids{background:var(--paper)}
.act.rec{background:#CFF0EA}
.dfoot{display:flex;gap:10px;margin-top:14px}

/* ---------- BIG SQUARE class tiles ---------- */
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.secbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
 aspect-ratio:1/1;min-height:145px;background:var(--c);border:3px solid var(--ink);border-radius:26px;
 box-shadow:0 7px 0 var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;text-align:center;
 padding:10px;overflow:hidden;transition:transform .07s,box-shadow .07s}
.secbox:active{transform:translateY(7px);box-shadow:0 0 0 var(--ink)}
.secbox .num{width:74px;height:74px;flex:none;display:grid;place-items:center;background:#fff;
 border:3px solid var(--ink);border-radius:50%;font-size:40px;font-weight:800;line-height:1;
 transform:rotate(var(--rot,0deg))}
.secbox .agelab{display:inline-flex;align-items:center;background:#fff;border:2.5px solid var(--ink);
 border-radius:999px;padding:6px 14px;font-size:20px;font-weight:800;line-height:1.1}
.secbox .kcount{font-size:15px;font-weight:700;opacity:.75;line-height:1.2}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:8px}
.dgrid .secbox{min-height:0;border-radius:20px;border-width:2.5px;box-shadow:0 5px 0 var(--ink);gap:5px;padding:8px}
.dgrid .secbox:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.dgrid .secbox .num{width:44px;height:44px;font-size:24px;border-width:2.5px}
.dgrid .secbox .agelab{font-size:12.5px;padding:3px 9px;border-width:2px}
.dgrid .secbox .kcount{font-size:12px}

/* ---------- attendance ---------- */
.att-sub{font-size:16px;font-weight:600;color:var(--ink2);margin:-4px 0 12px}
.sec-pill{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;padding:7px 15px;
 font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--ink)}
.date-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.date-row input{flex:1}
.dlab{font-weight:800;font-size:16px}
.tools{display:flex;gap:10px;margin-bottom:14px}
.att-list{display:flex;flex-direction:column;gap:11px;padding-bottom:130px}
.krow{display:flex;align-items:center;gap:12px;background:var(--paper);border:var(--line);border-radius:16px;
 padding:12px 14px;box-shadow:0 3px 0 var(--ink);user-select:none}
.krow .kinfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.krow .kinfo b{font-size:19.5px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .kinfo b svg{width:18px;height:18px;margin-left:5px;color:var(--orange)}
.krow .kinfo>span{font-size:15px;font-weight:600;color:var(--ink2)}
.krow.att{cursor:pointer;touch-action:manipulation}
.krow.att.off{background:#F3EADA}
.krow.att:not(.off){background:#F1FAEC}
.stbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:118px;
 border:2.5px solid var(--ink);border-radius:999px;padding:10px 14px;font-weight:800;font-size:16.5px;white-space:nowrap}
.stbtn.yes{background:var(--green)}
.stbtn.no{background:#fff;color:var(--danger)}
.stbtn svg{width:18px;height:18px}
.att-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
 background:var(--paper);border-top:var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
 display:flex;align-items:center;gap:14px;z-index:60}
.counts{flex:1;font-size:16px;font-weight:700;color:var(--ink2)}
.counts b{color:var(--ink);font-size:20px}
.note{display:flex;gap:9px;align-items:flex-start;background:#FFF0BF;border:2px dashed var(--ink);
 border-radius:14px;padding:10px 13px;font-size:15.5px;font-weight:600;margin-bottom:12px}
.note svg{width:19px;height:19px;flex:none;margin-top:1px}

/* ---------- records & charts ---------- */
.barchart{width:100%;height:auto;display:block}
.cval{font:700 17px 'Baloo 2','Noto Sans Ethiopic',sans-serif;fill:var(--ink)}
.clab{font:600 14px 'Baloo 2','Noto Sans Ethiopic',sans-serif;fill:var(--ink2)}
.chart-h{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;margin-bottom:10px}
.chart-h svg{width:20px;height:20px;flex:none}
.secrow2{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.secrow2:last-child{margin-bottom:2px}
.sbar{flex:1;height:28px;background:#F3EADA;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.sbar i{display:block;height:100%;min-width:0;background:var(--c);border-right:2.5px solid var(--ink)}
.cnum{flex:none;width:34px;text-align:right;font-size:19px;font-weight:800}
.trend{flex:none;width:58px;text-align:right;font-weight:800;font-size:15px}
.trend.up{color:#2F7D3B}.trend.down{color:var(--danger)}.trend.flat{color:var(--ink2)}
.rcard{background:var(--paper);border:var(--line);border-radius:18px;box-shadow:0 4px 0 var(--ink);margin-bottom:14px;overflow:hidden}
.rdate{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#FFEFBF;
 border-bottom:2px dashed rgba(58,42,33,.25);font-weight:800;font-size:16.5px}
.rdate svg{width:18px;height:18px;flex:none}
.rdate .rtot{margin-left:auto;font-size:14.5px;color:var(--ink2);font-weight:700;white-space:nowrap}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:none;
 text-align:left;cursor:pointer;font-size:16.5px;touch-action:manipulation}
.rrow+.rrow{border-top:2px dashed rgba(58,42,33,.18)}
.rrow:active{background:#FFF7E0}
.rrow .sc{width:36px;height:36px;flex:none;display:grid;place-items:center;border:2.5px solid var(--ink);
 border-radius:50%;background:var(--c);font-weight:800;font-size:17px}
.rrow b{flex:1;min-width:0;font-weight:800}
.rrow .cnt{flex:none;font-weight:700;color:var(--ink2);font-size:15.5px}

/* ---------- kids list ---------- */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink2)}
.search .input{padding-left:44px}
.chips{display:flex;flex-wrap:wrap;gap:9px;padding:2px 0 12px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;
 padding:8px 14px;font-weight:800;font-size:16px;background:var(--paper);box-shadow:0 3px 0 var(--ink);
 cursor:pointer;touch-action:manipulation;transition:transform .07s,box-shadow .07s}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.chip i.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--c)}
.chip.on{background:var(--c)}
.add-row{margin-bottom:14px}
.klist{display:flex;flex-direction:column;gap:11px;padding-bottom:30px}
.sec-tag{flex:none;border:2px solid var(--ink);border-radius:10px;padding:5px 9px;font-size:14px;font-weight:800;background:var(--c)}
.kmeta{font-size:14.5px;font-weight:600;color:var(--ink2)}
.badge-up{display:inline-flex;align-items:center;gap:5px;background:#D9F2DC;border:2px solid var(--ink);
 border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:3px}
.badge-up svg{width:13px;height:13px}
.no-res{display:none;text-align:center;color:var(--ink2);font-weight:700;padding:26px 0}

/* ---------- shared bits ---------- */
.empty{border:2.5px dashed rgba(58,42,33,.45);border-radius:20px;padding:30px 20px;text-align:center;
 color:var(--ink2);font-weight:600}
.empty svg{width:34px;height:34px;margin-bottom:8px}
.empty b{display:block;font-size:19px;color:var(--ink);margin-bottom:4px}
.card{background:var(--paper);border:var(--line);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:16px;margin-bottom:14px}
h3.sec{font-size:20px;font-weight:800;margin:22px 0 6px}
.hint{font-size:16px;font-weight:600;color:var(--ink2);margin:6px 0 12px}
.st-line{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.st-line svg{width:20px;height:20px;flex:none}
.msg{font-weight:700;font-size:16px;margin-top:12px}
.msg.ok{color:#2F7D3B}.msg.err{color:var(--danger)}
details{border:2px dashed rgba(58,42,33,.4);border-radius:14px;padding:12px 14px;margin-top:14px}
summary{font-weight:800;font-size:16.5px;cursor:pointer}
details ol{margin:10px 0 2px;padding-left:22px;font-size:15.5px;font-weight:600;color:var(--ink2)}
details li{margin-bottom:6px}
.binid{font-size:13.5px;font-weight:600;color:var(--ink2);word-break:break-all;margin-top:10px}

/* ---------- modal / toast / confetti ---------- */
.overlay{position:fixed;inset:0;background:rgba(58,42,33,.55);z-index:150;display:flex;align-items:flex-end;
 justify-content:center;opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.sheet{width:100%;max-width:560px;background:var(--paper);border:var(--line);border-bottom:none;
 border-radius:26px 26px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));
 transform:translateY(40px);transition:transform .22s ease}
.overlay.show .sheet{transform:none}
.handle{width:46px;height:5px;border-radius:99px;background:rgba(58,42,33,.25);margin:0 auto 10px}
.sheet h2{font-size:23px;font-weight:800;margin:6px 0 4px}
.sheet p{font-size:16.5px;font-weight:600;color:var(--ink2);margin:4px 0 8px}
.mrow{display:flex;gap:12px;margin-top:20px}
.mrow .btn{flex:1}
.mrow.col{flex-direction:column}
.prev{margin-top:14px}
.prev-pill{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:999px;
 padding:8px 15px;font-weight:800;font-size:16.5px}
.prev-note{font-size:14.5px;font-weight:600;color:var(--ink2);margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,80px);
 display:flex;align-items:center;gap:9px;background:var(--ink);color:#FFF6E3;border-radius:999px;
 padding:12px 20px;font-weight:800;font-size:16.5px;z-index:200;opacity:0;transition:.25s;max-width:90vw;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast svg{width:20px;height:20px;flex:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
</style>
</head>
<body>
<div id="errbar"><span></span><button type="button" id="errClose" aria-label="Dismiss">✕</button></div>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* v8 — deletions now sync via tombstones (Remove works everywhere),
   kid edits carry updatedAt so they win over the cloud, "No 1" title */

const JSONBIN={
  binId:'68dbdee5ae596e708f013aad',

  accessKey:'$2a$10$qBKrpQEIJZfjtps.QZGO8OimntTEtoGLTo1c0Fd/sGskEvpUqgmPu'
};

/* ================= translations (English + Amharic) ================= */
const STRINGS={
en:{

function ageOn(date,iso){
  if(typeof iso!=='string')return 0;
  const p=iso.split('-');if(p.length<3)return 0;
  const y=+p[0],m=+p[1],d=+p[2];
  if(!y||!m||!d)return 0;
  let a=date.getFullYear()-y;const mm=date.getMonth()+1-m;
  if(mm<0||(mm===0&&date.getDate()<d))a--;
  return Math.max(a,0);}
const calcAge=iso=>ageOn(new Date(),iso);
function sectionForAge(a){return a<7?1:a<9?2:a<11?3:a<13?4:a===13?5:6;}
function kidsIn(n){return state.children.filter(k=>sectionForAge(calcAge(k.birthday))===n).sort(byName);}
function nextBday(iso){const t=new Date();t.setHours(0,0,0,0);
  if(typeof iso!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return new Date(t.getFullYear()+50,0,1);
  const p=iso.split('-');
  let nb=new Date(t.getFullYear(),+p[1]-1,+p[2]);
  if(isNaN(nb.getTime()))return new Date(t.getFullYear()+50,0,1);
  if(nb<t)nb=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);return nb;}
function isBdayToday(k){const t=new Date();t.setHours(0,0,0,0);return nextBday(k.birthday).getTime()===t.getTime();}
function upcoming(days){const t=new Date();t.setHours(0,0,0,0);
  return state.children.map(k=>{const nb=nextBday(k.birthday);
    const du=Math.round((nb-t)/864e5);
    return{k,du:isFinite(du)?du:9999,turning:ageOn(nb,k.birthday)};
  }).filter(x=>x.du<=days).sort((a,b)=>a.du-b.du);}
function recentlyMoved(k){const past=new Date(Date.now()-45*864e5);
  return sectionForAge(calcAge(k.birthday))!==sectionForAge(ageOn(past,k.birthday));}

function lastSundays(n){

  const s=new Date(now);s.setDate(now.getDate()-now.getDay());
  for(let i=0;i<n;i++){const d=new Date(s);d.setDate(s.getDate()-7*i);out.push(d);}

function attForDate(ds){
  const per={};SECTIONS.forEach(s=>per[s.n]=0);
  let total=0,has=false;
  for(const k in state.attendance){
    const i=k.indexOf('|');if(i<1)continue;
    const d=k.slice(0,i),sec=+k.slice(i+1);
    if(d!==ds||!Object.prototype.hasOwnProperty.call(per,sec))continue;
    has=true;
    const p=state.attendance[k]&&state.attendance[k].present;
    const c=Array.isArray(p)?p.length:0;
    per[sec]=c;total+=c;}
  return{per,total,has};}

/* ---- MERGE helpers ----
   Attendance: newest savedAt wins per record.
   Kids: newest updatedAt wins per kid.
   Deletions ("tombstones"): once a kid is removed, their id stays
   excluded on every device — this is what makes Remove actually work. */
function attTime(rec){return rec&&typeof rec.savedAt==='string'?rec.savedAt:'';}
function kidTime(k){return k&&typeof k.updatedAt==='string'?k.updatedAt:'';}
function mergeAttendance(local,remote){
  const out=Object.assign({},local||{});
  const rem=remote||{};
  for(const k in rem){
    const l=out[k],r=rem[k];
    if(!l){out[k]=r;continue;}
    if(!r)continue;
    out[k]=(attTime(r)>attTime(l))?r:l;}
  return out;}
function sanitizeDels(o){
  const out={};
  if(o&&typeof o==='object'){
    for(const k in o){
      if(typeof k==='string'&&k&&typeof o[k]==='string')out[k]=o[k];}}
  return out;}
function mergeDels(a,b){
  const out=Object.assign({},a||{});
  Object.keys(b||{}).forEach(k=>{
    if(!out[k]||(b[k]>out[k]))out[k]=b[k];});
  return out;}
function mergeChildren(local,remote,dels){
  dels=dels||{};
  const map={};
  (remote||[]).forEach(k=>{if(k&&k.id&&!dels[k.id])map[k.id]=k;});
  (local||[]).forEach(k=>{
    if(!k||!k.id||dels[k.id])return;
    const r=map[k.id];
    if(!r||kidTime(k)>=kidTime(r))map[k.id]=k;});
  return Object.values(map).sort(byName);}

function sanitizeKids(arr){
  const out=[];
  (arr||[]).forEach(k=>{
    if(k&&typeof k.name==='string'&&k.name.trim()&&
       typeof k.birthday==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k.birthday)){
      out.push({id:(typeof k.id==='string'&&k.id)?k.id:uid(),
        name:k.name.trim().slice(0,60),birthday:k.birthday,
        gender:(typeof k.gender==='string'&&k.gender)?k.gender:'',
        phone:(typeof k.phone==='string'&&k.phone)?k.phone:'',
        updatedAt:(typeof k.updatedAt==='string')?k.updatedAt:'',
        sample:!!k.sample});
    }});
  return out;}

/* ================= persistence (localStorage + JSONBin) ================= */
function cacheState(){lsSet(LS_DATA,JSON.stringify(state));}
function fetchT(url,opts,ms){
  ms=ms||9000;
  if(typeof AbortController==='function'){
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
    return fetch(url,Object.assign({},opts,{signal:ctl.signal})).finally(()=>clearTimeout(t));}
  return new Promise((resolve,reject)=>{
    const t=setTimeout(()=>{const e=new Error('Timed out');e.name='AbortError';reject(e);},ms);
    fetch(url,opts).then(v=>{clearTimeout(t);resolve(v);},er=>{clearTimeout(t);reject(er);});});}
function httpErr(s){const e=new Error('HTTP '+s);e.status=s;return e;}
async function getBin(){
  const r=await fetchT('https://api.jsonbin.io/v3/b/'+JSONBIN.binId+'/latest',
    {headers:{'X-Master-Key':JSONBIN.masterKey,'X-Bin-Meta':'false'}});
  if(!r.ok)throw httpErr(r.status);return r.json();}
async function putBin(){
  const r=await fetchT('https://api.jsonbin.io/v3/b/'+JSONBIN.binId,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN.masterKey,'X-Bin-Versioning':'false'},
    body:JSON.stringify({children:state.children,attendance:state.attendance,deletions:state.deletions})});
  if(!r.ok)throw httpErr(r.status);}
/* Save = read cloud → merge → write merged blob. Nothing can be erased by a save. */
async function persist(){
  cacheState();
  sync='saving';updateSyncPills();
  try{
    let remoteKids=[],remoteAtt={},remoteDels={};
    try{
      const rec=await getBin();
      remoteKids=sanitizeKids(rec&&rec.children);
      remoteAtt=(rec&&rec.attendance&&typeof rec.attendance==='object')?rec.attendance:{};
      remoteDels=sanitizeDels(rec&&rec.deletions);
    }catch(e){/* offline: still upload what we have */}
    const dels=mergeDels(state.deletions,remoteDels);
    state={children:mergeChildren(state.children,remoteKids,dels),
           attendance:mergeAttendance(state.attendance,remoteAtt),
           deletions:dels};
    cacheState();
    await putBin();
    sync='saved';lastSync=fmtTime(new Date());updateSyncPills();return 'ok';
  }catch(e){sync='error';updateSyncPills();return 'err';}}

  if(sync==='error')return '<span class="pill err"><i data-lucide="wifi-off"></i>'+t(4)+'</span>';
  return '<span class="pill ok"><i data-lucide="cloud"></i>'+(lastSync?t(6,{time:lastSync}):t(5))+'</span>';}

function confetti(){
  const cv=$('#confetti'),dpr=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const colors=['#FF6B6B','#FF9838','#FFC531','#2EC4B6','#F2668B','#9B6BD1','#3A2A21'];
  const parts=Array.from({length:130},()=>({
    x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.25,
    w:5+Math.random()*6,h:8+Math.random()*8,c:colors[(Math.random()*colors.length)|0],
    vy:170+Math.random()*170,vx:-40+Math.random()*80,
    a:Math.random()*Math.PI,va:-3+Math.random()*6,round:Math.random()<.4}));
  const t0=performance.now();
  (function frame(t){
    const dt=Math.min((t-t0)/1000,.03);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    let alive=false;
    parts.forEach(p=>{
      p.y+=p.vy*dt;p.x+=p.vx*dt;p.a+=p.va*dt;
      if(p.y<innerHeight+30)alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.w*.6,0,7);ctx.fill();}
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();});
    if(alive&&t-t0<3000)requestAnimationFrame(frame);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);}

function loadAttRecord(){
  const rec=state.attendance[attState.date+'|'+attState.section];
  attState.present=new Set(rec&&Array.isArray(rec.present)?rec.present:[]);
  attState.existing=!!rec;}
function updateCounts(){
  const t=kidsIn(attState.section).length;
  $('#pc').textContent=attState.present.size;
  $('#ac').textContent=t-attState.present.size;}
function toggleKid(row){
  const id=row.dataset.id,on=attState.present.has(id);
  if(on)attState.present.delete(id);else attState.present.add(id);
  row.classList.toggle('off',on);
  const st=row.querySelector('.stbtn');
  st.className='stbtn '+(on?'no':'yes');
  st.innerHTML=on?'<i data-lucide="x"></i>'+t(71):'<i data-lucide="check"></i>'+t(70);
  icons();updateCounts();}
async function saveAttendance(){
  state.attendance[attState.date+'|'+attState.section]={present:[...attState.present],savedAt:new Date().toISOString()};
  attState.existing=true;
  cacheState();
  const r=await persist();

  else toast(t(75));

function screenRecords(){
  const app=$('#app');
  const dates=allRecordDates();
  let inner='';
  if(dates.length===0){
    inner='<div class="empty"><i data-lucide="bar-chart-3"></i><b>'+t(156)+'</b>'+t(157)+'<br>'+
      '<button class="btn btn-yellow" id="recGo" style="margin-top:14px"><i data-lucide="clipboard-check"></i>'+t(158)+'</button></div>';
  }else{
    /* --- Sundays bar chart, oldest on the left → newest on the right --- */
    const sundays=lastSundays(8).reverse().map(d=>{const ds=dateKeyOf(d);const a=attForDate(ds);return{d,ds,total:a.total,has:a.has};});
    const W=540,baseline=160,n=sundays.length,gap=10,pad=12;
    const bw=(W-pad*2-gap*(n-1))/n;
    const maxV=Math.max(1,...sundays.map(s=>s.total));
    let bars='';
    sundays.forEach((s,i)=>{
      const x=+(pad+i*(bw+gap)).toFixed(1),cx=+(x+bw/2).toFixed(1);
      const lab=s.d.getDate()+' '+MONTHS[lang][s.d.getMonth()];
      if(s.has){
        const bh=Math.max(8,Math.round(s.total/maxV*128));
        const y=baseline-bh;
        bars+='<rect x="'+x+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="'+bh+'" rx="9" fill="var(--teal)" stroke="var(--ink)" stroke-width="3"/>'+
          '<text x="'+cx+'" y="'+(y-9)+'" text-anchor="middle" class="cval">'+s.total+'</text>'+
          '<text x="'+cx+'" y="184" text-anchor="middle" class="clab">'+lab+'</text>';
      }else{
        bars+='<rect x="'+x+'" y="132" width="'+bw.toFixed(1)+'" height="26" rx="9" fill="none" stroke="var(--ink2)" stroke-width="2.5" stroke-dasharray="7 6" opacity=".55"/>'+
          '<text x="'+cx+'" y="150" text-anchor="middle" class="cval" style="fill:var(--ink2)">–</text>'+
          '<text x="'+cx+'" y="184" text-anchor="middle" class="clab">'+lab+'</text>';
      }});
    const chart='<div class="card"><div class="chart-h"><i data-lucide="sun"></i>'+t(154)+'</div>'+
      '<svg class="barchart" viewBox="0 0 540 196" role="img" aria-label="'+t(154)+'">'+
      '<line x1="6" y1="160" x2="534" y2="160" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>'+
      bars+'</svg></div>';

    /* --- per-section comparison: newest recorded Sunday vs the one before --- */
    const withRec=sundays.filter(s=>s.has);
    let secCard='';
    if(withRec.length){
      const latest=withRec[withRec.length-1];
      const prev=withRec[withRec.length-2]||null;
      const cur=attForDate(latest.ds).per;
      const pv=prev?attForDate(prev.ds).per:null;
      const maxC=Math.max(1,...SECTIONS.map(s=>cur[s.n]));
      const rows=SECTIONS.map(s=>{
        const c=cur[s.n];let tr='<span class="trend flat">—</span>';
        if(pv){const d=c-pv[s.n];
          if(d>0)tr='<span class="trend up">▲ '+d+'</span>';
          else if(d<0)tr='<span class="trend down">▼ '+(-d)+'</span>';
          else tr='<span class="trend flat">=</span>';}
        return '<div class="secrow2">'+
          '<span class="sec-tag" style="--c:'+s.hex+'">S'+s.n+'</span>'+
          '<div class="sbar" style="--c:'+s.hex+'"><i style="width:'+Math.round(c/maxC*100)+'%"></i></div>'+
          '<b class="cnum">'+c+'</b>'+tr+'</div>';}).join('');
      secCard='<div class="card"><div class="chart-h"><i data-lucide="users"></i>'+t(155,{date:fmtD(latest.ds)})+'</div>'+rows+'</div>';
    }

    /* --- full history, newest first --- */
    const thisYear=new Date().getFullYear();
    const hist=dates.map(ds=>{
      const a=attForDate(ds);
      const d=parseDS(ds);
      const yr=d.getFullYear()!==thisYear?(' '+d.getFullYear()):'';
      const rows=SECTIONS.filter(s=>Object.prototype.hasOwnProperty.call(state.attendance,ds+'|'+s.n)).map(s=>{
        const c=a.per[s.n];
        return '<button class="rrow" data-ds="'+ds+'" data-sec="'+s.n+'">'+
          '<span class="sc" style="--c:'+s.hex+'">'+s.n+'</span>'+
          '<b>'+t(9,{n:s.n})+'</b>'+
          '<span class="cnt">'+t(160,{n:c})+'</span></button>';}).join('');
      return '<div class="rcard"><div class="rdate"><i data-lucide="calendar-days"></i>'+fmtLong(d)+yr+
        '<span class="rtot">'+t(160,{n:a.total})+'</span></div>'+rows+'</div>';}).join('');
    inner=chart+secCard+'<h3 class="sec">'+t(159)+'</h3><p class="hint">'+t(161)+'</p>'+hist;
  }
  app.innerHTML='<div class="screen">'+topBar(t(152),'dashboard')+
    (dates.length?'<div class="att-sub">'+t(153)+'</div>':'')+inner+'</div>';
  icons();wireBack();
  const rg=$('#recGo');if(rg)rg.onclick=()=>go('sections');
  $$('[data-ds]').forEach(b=>b.onclick=()=>go('attendance',{section:+b.dataset.sec,date:b.dataset.ds,back:'records'}));
}

    state.deletions[id]=new Date().toISOString();
    closeModal();persist();toast(t(122));screenKids();};}

/* ================= settings ================= */
function stCardHTML(){
  if(sync==='loading')
    return '<div class="st-line"><i data-lucide="refresh-cw"></i>'+t(123)+'</div>';
  if(sync==='error')
    return '<div class="st-line"><i data-lucide="wifi-off"></i>'+t(124)+'</div>';
  return '<div class="st-line"><i data-lucide="cloud"></i>'+(lastSync?t(125,{time:lastSync}):t(125,{time:'—'}))+'</div>';}
function updateSettingsStatus(){const el=$('#stCard');if(el){el.innerHTML=stCardHTML();icons();}}

function screenSettings(){
  const app=$('#app');
  app.innerHTML=`
  <div class="screen">
    ${topBar(t(7),'dashboard')}
    <div class="card" id="stCard">${stCardHTML()}</div>
    <h3 class="sec">ቋንቋ · Language</h3>
    <div class="chips">
      <button class="chip${lang==='en'?' on':''}" id="langEn" style="--c:var(--yellow)">English</button>
      <button class="chip${lang==='am'?' on':''}" id="langAm" style="--c:var(--teal)">አማርኛ</button>
    </div>
    <h3 class="sec">${t(126)}</h3>
    <p class="hint">${t(127)}</p>
    <div class="mrow col">
      <button class="btn btn-yellow" id="pullNow"><i data-lucide="refresh-cw"></i>${t(128)}</button>
    </div>
    <div class="binid">${t(129,{id:esc(JSONBIN.binId)})}</div>
    <details>
      <summary>${t(130)}</summary>
      <ol>
        <li>${t(131)}</li>
        <li>${t(132)}</li>
        <li>${t(133)}</li>
      </ol>
    </details>
    <h3 class="sec">${t(134)}</h3>
    <p class="hint">${t(135)}</p>
    <div class="mrow col">
      <button class="btn" id="loadSample"><i data-lucide="sparkles"></i>${t(96,{n:SAMPLE.length})}</button>
      <button class="btn" id="clearSample"><i data-lucide="x"></i>${t(136)}</button>
    </div>
  </div>`;
  icons();wireBack();
  $('#langEn').onclick=()=>{setLang('en');screenSettings();};
  $('#langAm').onclick=()=>{setLang('am');screenSettings();};
  $('#pullNow').onclick=pullNow;
  $('#loadSample').onclick=loadSample;
  $('#clearSample').onclick=async()=>{
    const removed=state.children.filter(k=>k.sample);
    if(!removed.length){toast(t(139),'info');return;}
    const stamp=new Date().toISOString();
    state.children=state.children.filter(k=>!k.sample);
    removed.forEach(k=>{state.deletions[k.id]=stamp;});
    await persist();toast(t(140));screenSettings();};}

function explainBinError(e){
  if(e&&e.name==='AbortError')return t(148);
  if(e&&(e.status===401||e.status===403))return t(149);
  if(e&&(e.status===404||e.status===422))return t(150);
  return t(151);}
async function pullNow(){
  const btn=$('#pullNow');btn.disabled=true;btn.style.opacity=.6;
  sync='loading';updateSyncPills();
  try{
    const rec=await getBin();
    const remoteKids=sanitizeKids(rec&&rec.children);
    const remoteAtt=(rec&&rec.attendance&&typeof rec.attendance==='object')?rec.attendance:{};
    const remoteDels=sanitizeDels(rec&&rec.deletions);
    const dels=mergeDels(state.deletions,remoteDels);
    state={children:mergeChildren(state.children,remoteKids,dels),
           attendance:mergeAttendance(state.attendance,remoteAtt),
           deletions:dels};
    cacheState();
    toast(remoteKids.length?t(137,{n:remoteKids.length}):t(138),'check');
    try{await putBin();}catch(e){}
    sync='saved';lastSync=fmtTime(new Date());
  }catch(e){sync='error';toast(explainBinError(e),'info');}
  updateSyncPills();updateSettingsStatus();
  btn.disabled=false;btn.style.opacity=1;
  refreshSafeScreens();}

async function loadSample(){
  if(state.children.some(k=>k.sample)){toast(t(139),'info');return;}
  const stamp=new Date().toISOString();
  SAMPLE.forEach(([n,a,o])=>state.children.push({id:uid(),name:n,birthday:sampleBirthday(a,o),sample:true,updatedAt:stamp}));
  const r=await persist();
  toast(r==='err'?t(142):t(141,{n:SAMPLE.length}));
  refreshSafeScreens();}

/* ================= boot ================= */
const screens={login:screenLogin,langpick:screenLang,dashboard:screenDashboard,
  sections:screenSections,attendance:screenAttendance,records:screenRecords,
  kids:screenKids,settings:screenSettings};

/* Startup pull MERGES with the phone's data (never replaces it):
   - attendance: newest savedAt wins
   - kids: newest updatedAt wins; tombstoned ids stay deleted
   - anything new on this phone is pushed up so all teachers share it */
async function backgroundSync(){
  sync='loading';updateSyncPills();
  try{
    const rec=await getBin();
    const remoteKids=sanitizeKids(rec&&rec.children);
    const remoteAtt=(rec&&rec.attendance&&typeof rec.attendance==='object')?rec.attendance:{};
    const remoteDels=sanitizeDels(rec&&rec.deletions);
    const dels=mergeDels(state.deletions,remoteDels);
    const mergedKids=mergeChildren(state.children,remoteKids,dels);
    const mergedAtt=mergeAttendance(state.attendance,remoteAtt);
    const before=JSON.stringify({children:remoteKids,attendance:remoteAtt,deletions:remoteDels});
    const after=JSON.stringify({children:mergedKids,attendance:mergedAtt,deletions:dels});
    state={children:mergedKids,attendance:mergedAtt,deletions:dels};
    cacheState();
    if(before!==after){try{await putBin();}catch(e){}}
    sync='saved';lastSync=fmtTime(new Date());
  }catch(e){sync='error';}
  updateSyncPills();updateSettingsStatus();
  refreshSafeScreens();}

function boot(){
  try{
    const d=JSON.parse(lsGet(LS_DATA)||'null');
    if(d&&typeof d==='object'){
      const clean=sanitizeKids(d.children);
      const att=(d.attendance&&typeof d.attendance==='object')?d.attendance:{};
      const dels=sanitizeDels(d.deletions);
      if(clean.length||Object.keys(att).length||Object.keys(dels).length)
        state={children:clean,attendance:att,deletions:dels};
    }
  }catch(e){}
  const authed=ssGet('bmw_auth')==='1';
  const savedLang=ssGet('bmw_lang');
  if(authed&&savedLang)setLang(savedLang);
  go(authed?(savedLang?'dashboard':'langpick'):'login');
  backgroundSync();
}
boot();
</script>
